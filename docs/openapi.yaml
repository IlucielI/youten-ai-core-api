components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated user JWT token
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated admin staff JWT token
    BasicAuth:
      type: http
      scheme: basic
      description: Client application HTTP Basic Authentication (client_id:client_secret)

  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
    Unauthorized:
      description: Missing or expired authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
    Forbidden:
      description: Insufficient RBAC permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
    Conflict:
      description: Resource already exists or conflict detected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'

  schemas:
    BaseResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: operation completed successfully
        timestamp:
          type: string
          format: date-time
          example: '2026-10-08T00:00:00Z'
      required:
        - status
        - code
        - message
        - timestamp

    HealthServices:
      type: object
      properties:
        database:
          type: string
          example: connected
          enum: [connected, disconnected]
        redis:
          type: string
          example: connected
          enum: [connected, disconnected]
        s3:
          type: string
          example: connected
          enum: [connected, disconnected]
      required:
        - database
        - redis
        - s3

    HealthData:
      type: object
      properties:
        version:
          type: string
          example: 1.0.0
        git_hash:
          type: string
          example: dev
        uptime:
          type: string
          example: 1h23m45s
        services:
          $ref: '#/components/schemas/HealthServices'
      required:
        - version
        - git_hash
        - uptime
        - services

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: StrongPassw0rd!
        name:
          type: string
          example: Alex Doe
        anon_token:
          type: string
          description: Optional anonymous session token to auto-claim guest recordings
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: StrongPassw0rd!
        anon_token:
          type: string
          description: Optional anonymous session token to auto-claim guest recordings
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOi...

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string

    AuthData:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        claimed_recordings_count:
          type: integer
          description: Number of guest recordings transferred to the user account
          example: 2
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string

    AuthResponse:
      allOf:
