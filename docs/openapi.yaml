openapi: 3.0.3
info:
  title: Youten AI Core API
  version: 1.0.0
  description: |
    Enterprise-grade End-to-End AI Audio & Video Intelligence Platform Core API.
    Features:
    - Clean Architecture with strict separation of concerns (Gin, PostgreSQL, Redis, RabbitMQ, S3, MinIO)
    - User Authentication & Session Security (JWT, Refresh Rotation, Password Recovery, Quotas)
    - Audio/Video Ingestion (Direct S3 Presigned Uploads, Anti-SSRF URL Import)
    - Async Processing Pipeline with DLQ Retry and Real-time SSE Typewriter Streaming
    - Semantic Search & RAG Chat powered by pgvector Cosine Distance Embeddings
    - Multi-speaker Diarization & Versioned AI Summary Templates
    - Full Administrative Management & CMS Integration (Users, Quotas, RBAC Roles, Prompt Sandbox, DLQ, System Flags, Abuse Reports, Audit Trails, Cost Oversight)

servers:
  - url: /
    description: Primary API Server

tags:
  - name: System
    description: Liveness, readiness, diagnostics, and OpenAPI documentation
  - name: Auth
    description: User authentication, JWT tokens, password reset, and profiles
  - name: Recordings
    description: Media uploads, metadata ingestion, processing status, and lifecycle
  - name: Intelligence & Search
    description: Cross-recording semantic vector search and AI chat with workspace memory
  - name: Collaboration
    description: Shared viewing, inline comments, speaker labeling, and exports
  - name: Admin Users
    description: Administrative user management, quota overrides, and session revocation
  - name: Admin RBAC
    description: Role-based access control definitions and permission assignment
  - name: Admin Templates
    description: Management and testing of AI summary prompt templates and sandbox
  - name: Admin Pipeline
    description: Dead-letter queue (DLQ) inspection and async job reprocessing
  - name: Admin System
    description: Global system configuration, feature toggles, and maintenance mode
  - name: Admin Moderation
    description: Abuse report triage, content moderation, and ticket resolution
  - name: Admin Audit
    description: Immutable staff audit trails and administrative activity logs
  - name: Admin Analytics
    description: System telemetry overview and STT/LLM cost estimation oversight

paths:
  /v1/health:
    get:
      tags: [System]
      summary: Health & Diagnostics Check
      description: Returns service uptime, application version, git commit hash, and connection status for PostgreSQL, Redis, and S3.
      responses:
        '200':
          description: Health check diagnostics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/capabilities:
    get:
      tags: [System]
      summary: System & Feature Capabilities
      description: Returns feature availability flags, active providers (such as Meeting Voice Bots), and runtime capabilities.
      responses:
        '200':
          description: System capabilities payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /v1/templates:
    get:
      tags: [Recordings]
      summary: List Active Prompt Templates
      description: Returns all enabled structured summarization prompt templates available for recording processing.
      responses:
        '200':
          description: List of active prompt templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: templates retrieved successfully
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            category_key:
                              type: string
                              example: MOM
                            name:
                              type: string
                              example: Minutes of Meeting (MOM)
                            description:
                              type: string
                              example: Ekstraksi agenda, daftar kehadiran, keputusan final, dan action items.
                            is_active:
                              type: boolean
                              example: true
                  timestamp:
                    type: string
                    format: date-time

  /v1/auth/anon:
    post:
      tags: [Auth]
      summary: Issue Scoped Anonymous Token
      description: Issues a scoped anonymous session token for official client applications via HTTP Basic Authentication.
      security:
        - BasicAuth: []
      responses:
        '200':
          description: Anonymous token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register User
      description: Creates a new user account and returns the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login User
      description: Authenticates user credentials and issues an access and refresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh Access Token
      description: Rotates an expired access token using a valid refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout User
      security:
        - BearerAuth: []
      description: Terminates the current session and revokes its refresh token.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Forgot Password
      description: Dispatches a one-time password reset token to the registered email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset instructions sent if account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset Password
      description: Updates account password using a valid one-time reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get Profile
      security:
        - BearerAuth: []
      description: Returns the authenticated user's profile and quota details.
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Auth]
      summary: Update Profile
      security:
        - BearerAuth: []
      description: Updates display name or profile preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/change-password:
    put:
      tags: [Auth]
      summary: Change Password
      security:
        - BearerAuth: []
      description: Changes the current account password after verifying current credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/recordings/presign-upload:
    post:
      tags: [Recordings]
      summary: Generate Presigned Upload URL
      description: Generates a direct-to-S3 presigned PUT URL for media uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '200':
          description: Presigned URL payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'

  /v1/recordings/presign:
    post:
      tags: [Recordings]
      summary: Generate Presigned Upload URL (Alias)
      description: Alias endpoint for generating a direct-to-S3 presigned PUT URL for media uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '200':
          description: Presigned URL payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'

  /v1/recordings/upload:
    post:
      tags: [Recordings]
      summary: Ingest Recording Metadata
      description: Confirms S3 upload and kicks off the asynchronous processing pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRecordingRequest'
      responses:
        '201':
          description: Recording ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetailResponse'

  /v1/recordings/confirm-upload:
    post:
      tags: [Recordings]
      summary: Confirm Recording Upload (Alias)
      description: Alias endpoint confirming S3 upload and initiating asynchronous processing pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRecordingRequest'
      responses:
        '201':
          description: Recording ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetailResponse'

  /v1/recordings/import-url:
    post:
      tags: [Recordings]
      summary: Import Recording from URL
      description: Downloads external media (YouTube or direct audio/video) with SSRF defense.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportURLRequest'
      responses:
        '202':
          description: Import job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetailResponse'

  /v1/recordings/meeting-bot:
    post:
      tags: [Recordings]
      summary: Dispatch Meeting Voice Bot
      description: Dispatches an automated voice recording bot to an external meeting or voice channel (Discord, Google Meet, Teams, Zoom).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBotRequest'
      responses:
        '201':
          description: Bot dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchBotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/recordings/meeting-bot/{id}/status:
    get:
      tags: [Recordings]
      summary: Get Meeting Bot Session Status
      description: Retrieves the current status, recording state, and metadata of a meeting bot session.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bot session status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSessionStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/recordings/meeting-bot/{id}/stop:
    post:
      tags: [Recordings]
      summary: Stop Meeting Voice Bot Session
      description: Requests the active bot to leave the meeting or channel and finalizes the audio recording.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bot session stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopBotResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/bot/google-meet:
    post:
      tags: [Recordings]
      summary: Google Meet Bot Worker Webhook
      description: Receives asynchronous status transitions and audio upload completion callbacks from Google Meet headless bot workers.
      parameters:
        - name: X-Bot-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: Shared secret for webhook caller authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleMeetWebhookRequest'
      responses:
        '200':
          description: Webhook received and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/bot/ms-teams:
    post:
      tags: [Recordings]
      summary: Microsoft Teams Bot Worker Webhook
      description: Receives asynchronous status transitions and audio upload completion callbacks from Microsoft Teams / Azure Calling bot workers.
      parameters:
        - name: X-Bot-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: Shared secret for webhook caller authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MSTeamsWebhookRequest'
      responses:
        '200':
          description: Webhook received and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/bot/zoom:
    post:
      tags: [Recordings]
      summary: Zoom Bot Worker Webhook
      description: Receives asynchronous status transitions and audio upload completion callbacks from Zoom bot workers.
      parameters:
        - name: X-Bot-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
          description: Shared secret for webhook caller authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoomWebhookRequest'
      responses:
        '200':
          description: Webhook received and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/recordings/search:
    get:
      tags: [Intelligence & Search]
      summary: Cross-Recording Semantic Vector Search
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Semantic search match results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchRecordingsResponse'

  /v1/recordings/ask:
    post:
      tags: [Intelligence & Search]
      summary: Workspace Memory Multi-Recording AI Chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskWorkspaceRequest'
      responses:
        '200':
          description: Grounded workspace answer with source citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskWorkspaceResponse'

  /v1/speakers:
    get:
      tags: [Collaboration]
      summary: Workspace Speakers Directory
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregated speakers directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakersListResponse'

  /v1/recordings:
    get:
      tags: [Recordings]
      summary: List User Recordings
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated recordings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordingsResponse'

  /v1/recordings/{id}:
    get:
      tags: [Recordings]
      summary: Get Recording Detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording full detail including transcript and summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recordings]
      summary: Soft Delete Recording
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/claim:
    post:
      tags: [Recordings]
      summary: Claim Guest Recording
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording ownership transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/claim:
    post:
      tags: [Recordings]
      summary: Bulk Claim Guest Recordings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkClaimRequest'
      responses:
        '200':
          description: Recordings claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/share:
    patch:
      tags: [Collaboration]
      summary: Toggle Public Share Link
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleShareRequest'
      responses:
        '200':
          description: Share settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleShareResponse'

  /v1/recordings/shared/{token}:
    get:
      tags: [Collaboration]
      summary: View Shared Recording (Public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Read-only recording view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/recordings/{id}/progress:
    get:
      tags: [Recordings]
      summary: Stream Pipeline Progress SSE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server-sent event stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string

  /v1/recordings/{id}/retry:
    post:
      tags: [Recordings]
      summary: Smart Retry Failed Pipeline Stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pipeline retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/chat:
    post:
      tags: [Intelligence & Search]
      summary: Grounded RAG AI Chat (SSE Stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingChatRequest'
      responses:
        '200':
          description: Server-sent event typewriter tokens (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string

  /v1/recordings/{id}/speakers:
    put:
      tags: [Collaboration]
      summary: Rename Transcript Speakers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSpeakersRequest'
      responses:
        '200':
          description: Speakers renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/segments/{segmentId}:
    patch:
      tags: [Collaboration]
      summary: Edit Transcript Segment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSegmentRequest'
      responses:
        '200':
          description: Segment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/regenerate:
    post:
      tags: [Recordings]
      summary: Regenerate Summary with Template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateSummaryRequest'
      responses:
        '202':
          description: Summary regeneration job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/summaries:
    get:
      tags: [Recordings]
      summary: List Summary Versions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary versions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryVersionsResponse'

  /v1/recordings/{id}/summaries/{versionId}/activate:
    patch:
      tags: [Recordings]
      summary: Activate Summary Version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active summary version updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /v1/recordings/{id}/comments:
    get:
      tags: [Collaboration]
      summary: List Inline Comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inline comments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineCommentsResponse'
    post:
      tags: [Collaboration]
      summary: Create Inline Comment
      parameters:
        - name: id
          in: path
