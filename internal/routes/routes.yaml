# Route configuration for Go Core API
# Maps HTTP endpoints directly to Server methods
routes:
  # Health check endpoint
  - Method: GET
    Path: /v1/health
    Handler: HealthCheck

  # Documentation endpoints
  - Method: GET
    Path: /openapi.yaml
    Handler: OpenAPISpec

  - Method: GET
    Path: /docs
    Handler: APIDocs

  # Authentication endpoints
  - Method: POST
    Path: /v1/auth/register
    Handler: Register

  - Method: POST
    Path: /v1/auth/login
    Handler: Login
