# Route configuration for Go Core API
# Maps HTTP endpoints directly to Server methods.
#
# Style conventions (keep consistent):
#   - One list item per route using an inline leading dash.
#   - Field order: method, path, handler, then auth/optional_auth/basic_auth when needed.
#   - A single comment line above each route describing its purpose.
routes:
  # Liveness and readiness health probe.
  - method: GET
    path: /v1/health
    handler: HealthCheck

  # OpenAPI specification document.
  - method: GET
    path: /openapi.yaml
    handler: OpenAPISpec

  # Interactive API documentation UI.
  - method: GET
    path: /docs
    handler: APIDocs

  # Issue a scoped anonymous session token for official client applications via HTTP Basic Auth.
  - method: POST
    path: /v1/auth/anon
    handler: AnonToken

  # Register a new user account.
  - method: POST
    path: /v1/auth/register
    handler: Register
    auth: true

  # Confirm email verification using a 6-digit OTP code or magic link token.
  - method: POST
    path: /v1/auth/verify-email
    handler: VerifyEmail
    auth: true

  # Resend email verification code and magic link with rate limiting.
  - method: POST
    path: /v1/auth/verify-email/resend
    handler: ResendVerificationEmail
    auth: true

  # Authenticate and issue an access + refresh token pair.
  - method: POST
    path: /v1/auth/login
    handler: Login
    auth: true

  # Rotate an expired access token using a valid refresh token.
  - method: POST
    path: /v1/auth/refresh
    handler: RefreshToken
    auth: true

  # Terminate the current session and revoke its refresh token.
  - method: POST
    path: /v1/auth/logout
    handler: Logout
    auth: true

  # Request a password reset email (one-time token).
  - method: POST
    path: /v1/auth/forgot-password
    handler: ForgotPassword
    auth: true

  # Confirm a password reset using a valid reset token.
  - method: POST
    path: /v1/auth/reset-password
    handler: ResetPassword
    auth: true

  # Retrieve the authenticated user's profile and remaining quota.
  - method: GET
    path: /v1/auth/me
    handler: GetMe
    auth: true

  # Update the authenticated user's profile.
  - method: PUT
    path: /v1/auth/me
    handler: UpdateProfile
    auth: true
    permission: "profile:manage"

  # Change the authenticated user's password.
  - method: PUT
    path: /v1/auth/change-password
    handler: ChangePassword
    auth: true
    permission: "profile:manage"

  # Retrieve available active summary prompt templates.
  - method: GET
    path: /v1/templates
    handler: ListTemplates
    auth: true

  # Generate a presigned URL for direct-to-S3 recording upload.
  - method: POST
    path: /v1/recordings/presign-upload
    handler: PresignUpload
    scope: "recordings:create"

  # Alias for presigned upload URL generation.
  - method: POST
    path: /v1/recordings/presign
    handler: PresignUpload
    scope: "recordings:create"

  # Confirm an upload and ingest recording metadata.
  - method: POST
    path: /v1/recordings/upload
    handler: UploadRecording
    scope: "recordings:create"

  # Alias for upload confirmation and metadata ingestion.
  - method: POST
    path: /v1/recordings/confirm-upload
    handler: UploadRecording
    scope: "recordings:create"

  # Import a recording from a URL with anti-SSRF defense.
  - method: POST
    path: /v1/recordings/import-url
    handler: ImportURL
    scope: "recordings:create"

  # Cross-recording semantic vector search (registered users).
  - method: GET
    path: /v1/recordings/search
    handler: SearchRecordings
    auth: true
    permission: "workspace:search"

  # Cross-recording workspace memory AI chat (registered users).
  - method: POST
    path: /v1/recordings/ask
    handler: AskWorkspaceMemory
    auth: true
    permission: "workspace:memory"

  # Workspace speakers directory (registered users).
  - method: GET
    path: /v1/speakers
    handler: GetWorkspaceSpeakers
    auth: true

  # Retrieve recording detail (owner via token or registered user).
  - method: GET
    path: /v1/recordings/:id
    handler: GetRecordingDetail
    auth: true

  # List and filter the authenticated user's recordings.
  - method: GET
    path: /v1/recordings
    handler: ListRecordings
    auth: true

  # Delete a recording.
  - method: DELETE
    path: /v1/recordings/:id
    handler: DeleteRecording
    auth: true

  # Claim a single guest recording into the authenticated account.
  - method: POST
    path: /v1/recordings/:id/claim
    handler: ClaimRecording
    auth: true

  # Bulk-claim guest recordings into the authenticated account.
  - method: POST
    path: /v1/recordings/claim
    handler: ClaimBulkRecordings
    auth: true

  # Toggle a recording's public read-only share link.
  - method: PATCH
    path: /v1/recordings/:id/share
    handler: ToggleRecordingShare
    auth: true
    permission: "recordings:share"

  # Public read-only shared recording viewer.
  - method: GET
    path: /v1/recordings/shared/:token
    handler: GetSharedRecording
    auth: true

  # Stream real-time pipeline progress via SSE.
  - method: GET
    path: /v1/recordings/:id/progress
    handler: StreamRecordingProgress
    auth: true

  # Smart retry of a failed pipeline stage without re-upload.
  - method: POST
    path: /v1/recordings/:id/retry
    handler: RetryRecording
    auth: true

  # Interactive grounded RAG AI chat with SSE typewriter streaming.
  - method: POST
    path: /v1/recordings/:id/chat
    handler: StreamRecordingChat
    auth: true

  # Rename transcript speaker labels.
  - method: PUT
    path: /v1/recordings/:id/speakers
    handler: UpdateTranscriptSpeakers
    auth: true

  # Update individual transcript segment text.
  - method: PATCH
    path: /v1/recordings/:id/segments/:segmentId
    handler: UpdateTranscriptSegment
    auth: true

  # Regenerate the summary with a new template/angle.
  - method: POST
    path: /v1/recordings/:id/regenerate
    handler: RegenerateSummary
    auth: true

  # List all summary versions of a recording.
  - method: GET
    path: /v1/recordings/:id/summaries
    handler: ListSummaryVersions
    auth: true

  # Activate a specific summary version.
  - method: PATCH
    path: /v1/recordings/:id/summaries/:versionId/activate
    handler: ActivateSummaryVersion
    auth: true

  # Create a timestamped inline comment.
  - method: POST
    path: /v1/recordings/:id/comments
    handler: CreateInlineComment
    auth: true

  # List a recording's inline comments.
  - method: GET
    path: /v1/recordings/:id/comments
    handler: ListInlineComments
    auth: true

  # Delete an inline comment.
  - method: DELETE
    path: /v1/recordings/:id/comments/:commentId
    handler: DeleteInlineComment
    auth: true

  # Export the active summary and transcript (PDF, viewer allowed).
  - method: GET
    path: /v1/recordings/:id/export
    handler: ExportRecording
    auth: true

  # Join the meeting voice bot beta waitlist.
  - method: POST
    path: /v1/waitlist/bot
    handler: JoinBotWaitlist
    auth: true

  # Dispatch a voice bot to join a meeting or voice channel.
  - method: POST
    path: /v1/recordings/meeting-bot
    handler: DispatchMeetingBot
    auth: true

  # Check real-time lifecycle status of a meeting bot session.
  - method: GET
    path: /v1/recordings/meeting-bot/:id/status
    handler: GetBotSessionStatus
    auth: true

  # Command a meeting bot to leave the meeting and finish recording.
  - method: POST
    path: /v1/recordings/meeting-bot/:id/stop
    handler: StopBotSession
    auth: true

  # Report ingestion and voice bot platform capabilities.
  - method: GET
    path: /v1/capabilities
    handler: GetCapabilities
    auth: true

  # Asynchronous webhook for Google Meet bot worker status and recording upload callbacks.
  - method: POST
    path: /v1/webhooks/bot/google-meet
    handler: HandleGoogleMeetWebhook

  # Asynchronous webhook for Microsoft Teams bot worker status and recording callbacks.
  - method: POST
    path: /v1/webhooks/bot/ms-teams
    handler: HandleMSTeamsWebhook

  # Asynchronous webhook for Zoom bot worker status and recording callbacks.
  - method: POST
    path: /v1/webhooks/bot/zoom
    handler: HandleZoomWebhook

  # Authenticate staff administrator credentials and issue admin access token (CMS).
  - method: POST
    path: /v1/admin/login
    handler: AdminLogin
    auth: true

  # Rotate staff administrator access token using valid refresh token (CMS).
  - method: POST
    path: /v1/admin/refresh
    handler: AdminRefreshToken
    auth: true

  # Request staff administrator password reset email (CMS).
  - method: POST
    path: /v1/admin/forgot-password
    handler: AdminForgotPassword
    auth: true

  # Reset staff administrator password using recovery token (CMS).
  - method: POST
    path: /v1/admin/reset-password
    handler: AdminResetPassword
    auth: true

  # Admin list registered users (CMS).
  - method: GET
    path: /v1/admin/users
    handler: AdminListUsers
    admin_auth: true
    permission: "users:read"

  # Admin override user daily transcription quota (CMS).
  - method: PATCH
    path: /v1/admin/users/:id/quota
    handler: AdminOverrideUserQuota
    admin_auth: true
    permission: "users:write"

  # Admin revoke all active sessions for a user (CMS).
  - method: POST
    path: /v1/admin/users/:id/revoke-sessions
    handler: AdminRevokeUserSessions
    admin_auth: true
    permission: "users:write"

  # Admin assign user role (CMS).
  - method: PATCH
    path: /v1/admin/users/:id/role
    handler: AdminAssignUserRole
    admin_auth: true
    permission: "users:write"

  # Admin list RBAC roles (CMS).
  - method: GET
    path: /v1/admin/roles
    handler: AdminListRoles
    admin_auth: true
    permission: "roles:read"

  # Admin create RBAC role (CMS).
  - method: POST
    path: /v1/admin/roles
    handler: AdminCreateRole
    admin_auth: true
    permission: "roles:write"

  # Admin update RBAC role (CMS).
  - method: PUT
    path: /v1/admin/roles/:id
    handler: AdminUpdateRole
    admin_auth: true
    permission: "roles:write"

  # Admin list customer user roles (CMS).
  - method: GET
    path: /v1/admin/user-roles
    handler: AdminListUserRoles
    admin_auth: true
    permission: "roles:read"

  # Admin create customer user role (CMS).
  - method: POST
    path: /v1/admin/user-roles
    handler: AdminCreateUserRole
    admin_auth: true
    permission: "roles:write"

  # Admin update customer user role (CMS).
  - method: PUT
    path: /v1/admin/user-roles/:id
    handler: AdminUpdateUserRole
    admin_auth: true
    permission: "roles:write"

  # Admin list prompt templates (CMS).
  - method: GET
    path: /v1/admin/templates
    handler: AdminListTemplates
    admin_auth: true
    permission: "templates:read"

  # Admin create prompt template (CMS).
  - method: POST
    path: /v1/admin/templates
    handler: AdminCreateTemplate
    admin_auth: true
    permission: "templates:write"

  # Admin update prompt template (CMS).
  - method: PUT
    path: /v1/admin/templates/:id
    handler: AdminUpdateTemplate
    admin_auth: true
    permission: "templates:write"

  # Admin test prompt template sandbox (CMS).
  - method: POST
    path: /v1/admin/templates/test
    handler: AdminTestTemplate
    admin_auth: true
    permission: "templates:write"

  # Admin monitor DLQ and stuck pipeline jobs (CMS).
  - method: GET
    path: /v1/admin/pipeline/dlq
    handler: AdminGetDLQPipeline
    admin_auth: true
    permission: "ops:read"

  # Admin reprocess dead-lettered or stuck pipeline jobs (CMS).
  - method: POST
    path: /v1/admin/pipeline/dlq/retry
    handler: AdminRetryDLQJob
    admin_auth: true
    permission: "ops:write"

  # Admin get system config and maintenance mode flags (CMS).
  - method: GET
    path: /v1/admin/config
    handler: AdminGetSystemConfig
    admin_auth: true
    permission: "config:read"

  # Admin update system config and maintenance mode flags (CMS).
  - method: PATCH
    path: /v1/admin/config
    handler: AdminUpdateSystemConfig
    admin_auth: true
    permission: "config:write"

  # Admin list moderation abuse reports (CMS).
  - method: GET
    path: /v1/admin/reports
    handler: AdminListReports
    admin_auth: true
    permission: "moderation:read"

  # Admin resolve moderation abuse report (CMS).
  - method: POST
    path: /v1/admin/reports/:id/resolve
    handler: AdminResolveReport
    admin_auth: true
    permission: "moderation:write"

  # Admin list staff audit trail logs (CMS).
  - method: GET
    path: /v1/admin/audit-logs
    handler: AdminListAuditLogs
    admin_auth: true
    permission: "audit:read"

  # Admin get system overview stats (CMS).
  - method: GET
    path: /v1/admin/stats/overview
    handler: AdminGetOverviewStats
    admin_auth: true
    permission: "analytics:read"

  # Admin get cost oversight calculations (CMS).
  - method: GET
    path: /v1/admin/stats/costs
    handler: AdminGetCostOversight
    admin_auth: true
    permission: "analytics:read"

  # Admin list all generation and pipeline jobs (CMS).
  - method: GET
    path: /v1/admin/jobs
    handler: AdminListJobs
    admin_auth: true
    permission: "ops:read"










