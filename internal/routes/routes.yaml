# Route configuration for Go Core API
# Maps HTTP endpoints directly to Server methods
routes:
  # Health check endpoint
  - method: GET
    path: /v1/health
    handler: HealthCheck

  # Documentation endpoints
  - method: GET
    path: /openapi.yaml
    handler: OpenAPISpec

  - method: GET
    path: /docs
    handler: APIDocs

  # Authentication endpoints
  - method: POST
    path: /v1/auth/register
    handler: Register

  - method: POST
    path: /v1/auth/login
    handler: Login

  # Token rotation endpoint (schema contract: lowercase method, path, handler)
  - method: POST
    path: /v1/auth/refresh
    handler: RefreshToken

  # Session termination endpoint (schema contract: lowercase method, path, handler)
  - method: POST
    path: /v1/auth/logout
    handler: Logout

  # Password recovery endpoint
  - method: POST
    path: /v1/auth/forgot-password
    handler: ForgotPassword

  # Password reset confirmation endpoint
  - method: POST
    path: /v1/auth/reset-password
    handler: ResetPassword

  # Current user profile endpoint
  - method: GET
    path: /v1/auth/me
    handler: GetMe
    auth: true

  # Update current user profile endpoint
  - method: PUT
    path: /v1/auth/me
    handler: UpdateProfile
    auth: true

  # Change password endpoint
  - method: PUT
    path: /v1/auth/change-password
    handler: ChangePassword
    auth: true

  # Recording presigned upload direct to S3
  - method: POST
    path: /v1/recordings/presign-upload
    handler: PresignUpload
    optional_auth: true

  - method: POST
    path: /v1/recordings/presign
    handler: PresignUpload
    optional_auth: true

  # Recording confirmation & metadata ingestion endpoint
  - method: POST
    path: /v1/recordings/upload
    handler: UploadRecording
    optional_auth: true

  - method: POST
    path: /v1/recordings/confirm-upload
    handler: UploadRecording
    optional_auth: true

  # Recording link import ingestion with anti-SSRF defense
  - method: POST
    path: /v1/recordings/import-url
    handler: ImportURL
    optional_auth: true

  # Cross-meeting semantic vector search endpoint
  - method: GET
    path: /v1/recordings/search
    handler: SearchRecordings
    auth: true

  # Cross-meeting workspace memory AI chat endpoint
  - method: POST
    path: /v1/recordings/ask
    handler: AskWorkspaceMemory
    auth: true

  # Workspace speakers directory endpoint
  - method: GET
    path: /v1/speakers
    handler: GetWorkspaceSpeakers
    auth: true



  # Recording detail retrieval endpoint
  - method: GET
    path: /v1/recordings/:id
    handler: GetRecordingDetail
    optional_auth: true

  # List & filter recordings library endpoint
  - method: GET
    path: /v1/recordings
    handler: ListRecordings
    auth: true

  # Delete recording endpoint
  -
    method: DELETE
    path: /v1/recordings/:id
    handler: DeleteRecording
    auth: true

  # Claim guest recording endpoint
  -
    method: POST
    path: /v1/recordings/:id/claim
    handler: ClaimRecording
    auth: true

  # Bulk claim guest recordings endpoint
  -
    method: POST
    path: /v1/recordings/claim
    handler: ClaimBulkRecordings
    auth: true

  # Toggle recording public share endpoint
  -
    method: PATCH
    path: /v1/recordings/:id/share
    handler: ToggleRecordingShare
    auth: true

  # Public read-only shared recording viewer endpoint
  -
    method: GET
    path: /v1/recordings/shared/:token
    handler: GetSharedRecording

  # Real-time pipeline progress SSE endpoint
  -
    method: GET
    path: /v1/recordings/:id/progress
    handler: StreamRecordingProgress
    optional_auth: true

  # Smart pipeline retry endpoint
  -
    method: POST
    path: /v1/recordings/:id/retry
    handler: RetryRecording
    optional_auth: true

  # Interactive RAG AI Chat Typewriter SSE endpoint
  -
    method: POST
    path: /v1/recordings/:id/chat
    handler: StreamRecordingChat
    optional_auth: true

  # Update transcript speaker labels endpoint
  -
    method: PUT
    path: /v1/recordings/:id/speakers
    handler: UpdateTranscriptSpeakers
    optional_auth: true

  # Regenerate summary with custom angle endpoint
  -
    method: POST
    path: /v1/recordings/:id/regenerate
    handler: RegenerateSummary
    optional_auth: true

  # List summary versions endpoint
  -
    method: GET
    path: /v1/recordings/:id/summaries
    handler: ListSummaryVersions
    optional_auth: true

  # Activate summary version endpoint
  -
    method: PATCH
    path: /v1/recordings/:id/summaries/:versionId/activate
    handler: ActivateSummaryVersion
    optional_auth: true

  # Create timestamped inline comment endpoint
  -
    method: POST
    path: /v1/recordings/:id/comments
    handler: CreateInlineComment
    optional_auth: true

  # List recording inline comments endpoint
  -
    method: GET
    path: /v1/recordings/:id/comments
    handler: ListInlineComments
    optional_auth: true

  # Delete recording inline comment endpoint
  -
    method: DELETE
    path: /v1/recordings/:id/comments/:commentId
    handler: DeleteInlineComment
    optional_auth: true

  # Export meeting MOM and transcript endpoint
  -
    method: GET
    path: /v1/recordings/:id/export
    handler: ExportRecording
    optional_auth: true

  # Meeting voice bot beta waitlist signup endpoint
  -
    method: POST
    path: /v1/waitlist/bot
    handler: JoinBotWaitlist










